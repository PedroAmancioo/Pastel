<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pastel de Gala</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, Helvetica, sans-serif;

    background:
        linear-gradient(
            rgba(255, 94, 0, 0.65),
            rgba(255, 45, 85, 0.65)
        ),
        url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Brazilian_pastel.jpg");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}


        .container {
            width: 90%;
            max-width: 500px;
            padding: 45px;

            text-align: center;

            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.3);

            animation: aparecer 0.6s ease;
        }

        h1 {
            margin-bottom: 30px;

            color: #ff5e00;
            font-size: 42px;

            text-shadow: 2px 2px 0 #ffd166;
        }

        h1 span {
            color: #ff2d55;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            padding: 15px 18px;

            border: 2px solid #ddd;
            border-radius: 12px;

            font-size: 18px;
            outline: none;

            transition: 0.3s;
        }

        input:focus {
            border-color: #ff5e00;

            box-shadow:
                0 0 0 4px rgba(255, 94, 0, 0.15);
        }

        button {
            padding: 15px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                90deg,
                #ff8c00,
                #ff2d55
            );

            color: white;
            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;
        }

        button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 8px 20px rgba(255, 45, 85, 0.35);
        }

        button:active {
            transform: translateY(0);
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>
        Pastel de
        <span th:text="${nome}">Gala</span>
    </h1>

    <form action="/" method="get">

        <input
                type="text"
                name="nome"
                placeholder="Digite o sabor do pastel..."
        >

        <button type="submit">
            🥟 Fazer o pastel
        </button>

    </form>

</div>

</body>

</html>
